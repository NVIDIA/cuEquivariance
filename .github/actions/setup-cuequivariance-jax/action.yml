name: 'Setup cuequivariance-jax'
description: 'Install cuequivariance-jax with all JAX dependencies'

inputs:
  use-gpu:
    description: 'Install GPU dependencies (jax[cuda12], CUDA ops packages)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install JAX (CPU)
      if: inputs.use-gpu != 'true'
      shell: bash
      run: |
        # TODO: drop the <0.11.2 pin once flax 0.12.10 ships (google/flax#5596):
        # jax 0.11.2 removed jax.experimental.hijax.HiPrimitive, which flax<=0.12.9 imports.
        uv pip install -U pytest "jax<0.11.2"

    - name: Install JAX (GPU)
      if: inputs.use-gpu == 'true'
      shell: bash
      run: |
        uv pip install -U pytest "jax[cuda12]<0.11.2"
        uv pip install nvidia-cusolver-cu12==11.7.3.90
        uv pip install nvidia-cublas-cu12
    
    - name: Install common dependencies
      shell: bash
      run: |
        uv pip install triton
        uv pip install "flax>=0.12.0" "equinox>=0.11.11"
    
    - name: Clean and install packages
      shell: bash
      run: |
        uv pip uninstall cuequivariance cuequivariance_jax cuequivariance_torch 2>/dev/null || true
        uv pip install -e ./cuequivariance
        uv pip install -e ./cuequivariance_jax
    
    - name: Verify installation
      shell: bash
      run: |
        python -c "import cuequivariance; print('cue', cuequivariance.__version__)"
        python -c "import cuequivariance_jax; print('cuex', cuequivariance_jax.__version__)"
